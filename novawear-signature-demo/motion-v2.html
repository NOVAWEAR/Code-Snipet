<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NOVAWEAR Motion V2</title></head><body style="margin:0;background:#050505;color:#fff;font-family:Arial"><div style="min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px"><div><b>NOVAWEAR®</b><p style="color:#888">Motion Experience wird geladen …</p></div></div><script>fetch('app.html?motionv2=1').then(r=>r.text()).then(html=>{const motionCSS=`<style>@keyframes nwFadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}@keyframes nwFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes nwPulse{0%{box-shadow:0 0 0 0 rgba(223,255,79,.38)}70%{box-shadow:0 0 0 12px rgba(223,255,79,0)}100%{box-shadow:0 0 0 0 rgba(223,255,79,0)}}.card,.head,.proof,.ugcitem{animation:nwFadeUp .55s cubic-bezier(.2,.8,.2,1) both}.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}.card:nth-child(4){animation-delay:.18s}.heroimg img{transition:transform .7s cubic-bezier(.2,.8,.2,1)}.heroimg:hover img{transform:scale(1.025)}.herocopy,.gsm{animation:nwFloat 4.8s ease-in-out infinite}.card{transition:transform .28s ease,box-shadow .28s ease}.card:hover{transform:translateY(-5px);box-shadow:0 18px 50px #0008}.media img{transition:transform .4s cubic-bezier(.2,.8,.2,1)}.card:hover .media img{transform:scale(1.035)}.fitLaunch{width:100%;margin-top:10px;padding:13px 14px;border:1px solid #dfff4f;background:#151515;color:#fff;font-size:10px;letter-spacing:.1em;font-weight:800}.fitLaunch i{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#dfff4f;color:#111;font-style:normal;margin-right:7px;animation:nwPulse 2s infinite}.fitModal{position:fixed;inset:0;z-index:120;display:none;align-items:flex-end;justify-content:center;padding:16px;background:rgba(0,0,0,.72);backdrop-filter:blur(10px)}.fitModal.open{display:flex}.fitCard{width:min(560px,100%);background:#f4f3ee;color:#111;border-radius:20px 20px 8px 8px;overflow:hidden;animation:nwFadeUp .35s ease;box-shadow:0 30px 90px #000c}.fitHead{padding:18px;border-bottom:1px solid #d8d7d0;display:flex;justify-content:space-between}.fitProgress{height:4px;background:#ddd}.fitProgress i{display:block;height:100%;background:#111;transition:width .3s}.fitBody{padding:22px}.fitStep{display:none}.fitStep.on{display:block;animation:nwFadeUp .28s ease}.fitOptions{display:grid;gap:8px;margin-top:18px}.fitOption{border:1px solid #c7c6bf;background:#fff;padding:14px;text-align:left;border-radius:10px}.fitOption.sel{border-color:#111;background:#111;color:#fff}.fitFoot{padding:14px 18px;border-top:1px solid #d8d7d0;display:flex;justify-content:space-between;align-items:center}.fitNext,.fitApply{border:0;background:#111;color:#fff;padding:12px 16px;border-radius:8px}.fitNext:disabled{opacity:.35}.fitResultSize{font-size:50px;font-weight:900}@media(min-width:851px){.fitModal{align-items:center}.fitCard{border-radius:18px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style>`;const motionScript=`<script>(function(){let step=1,ans={style:null,height:null,feel:null},rec='';function addFit(){const fb=document.querySelector('.fitbox');if(fb&&!fb.querySelector('.fitLaunch'))fb.insertAdjacentHTML('beforeend','<button class="fitLaunch" type="button" onclick="openFitAdvisor()"><i>↗</i> ANIMIERTEN FITBERATER STARTEN</button>');if(!document.getElementById('fitModal'))document.body.insertAdjacentHTML('beforeend',\`<div class="fitModal" id="fitModal"><div class="fitCard"><div class="fitHead"><div><small>NOVAWEAR® FIT SYSTEM</small><br><b>Finde deinen Fit in 3 Schritten</b></div><button onclick="closeFitAdvisor()" style="border:0;background:none;font-size:22px">×</button></div><div class="fitProgress"><i id="fitProg" style="width:33%"></i></div><div class="fitBody"><div class="fitStep on" data-step="1"><h3>Wie trägst du Streetwear?</h3><div class="fitOptions"><button class="fitOption" onclick="fitChoose('style','clean',this)">Clean</button><button class="fitOption" onclick="fitChoose('style','oversized',this)">Oversized</button><button class="fitOption" onclick="fitChoose('style','extra',this)">Extra Oversized</button></div></div><div class="fitStep" data-step="2"><h3>Wie groß bist du?</h3><div class="fitOptions"><button class="fitOption" onclick="fitChoose('height','short',this)">Unter 170 cm</button><button class="fitOption" onclick="fitChoose('height','mid',this)">170–185 cm</button><button class="fitOption" onclick="fitChoose('height','tall',this)">Über 185 cm</button></div></div><div class="fitStep" data-step="3"><h3>Wie soll es sitzen?</h3><div class="fitOptions"><button class="fitOption" onclick="fitChoose('feel','closer',this)">Eher körpernah</button><button class="fitOption" onclick="fitChoose('feel','true',this)">Wie auf den Produktbildern</button><button class="fitOption" onclick="fitChoose('feel','loose',this)">Extra locker</button></div></div><div class="fitStep" data-step="4"><small>DEINE EMPFEHLUNG</small><div class="fitResultSize" id="fitFinalSize">M</div><p id="fitFinalText"></p><button class="fitApply" onclick="fitApply()">GRÖSSE ÜBERNEHMEN</button></div></div><div class="fitFoot"><span id="fitStepLabel" style="font-size:10px;color:#777">SCHRITT 1 VON 3</span><button class="fitNext" id="fitNext" onclick="fitNext()" disabled>WEITER →</button></div></div></div>\`)}function render(){document.querySelectorAll('.fitStep').forEach(x=>x.classList.toggle('on',+x.dataset.step===step));document.getElementById('fitProg').style.width=(step===4?100:step*33.33)+'%';document.getElementById('fitStepLabel').textContent=step===4?'EMPFEHLUNG':'SCHRITT '+step+' VON 3';const n=document.getElementById('fitNext');n.style.display=step===4?'none':'block';n.disabled=step<=3&&!ans[['style','height','feel'][step-1]]}window.openFitAdvisor=function(){step=1;ans={style:null,height:null,feel:null};addFit();document.getElementById('fitModal').classList.add('open');render()};window.closeFitAdvisor=function(){document.getElementById('fitModal')?.classList.remove('open')};window.fitChoose=function(k,v,el){ans[k]=v;el.parentElement.querySelectorAll('.fitOption').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');document.getElementById('fitNext').disabled=false};window.fitNext=function(){if(step<3){step++;render()}else{step=4;let sizes=(typeof cur!=='undefined'&&cur.sizes)||['XS','S','M','L','XL'];let base=(typeof sz!=='undefined'&&sz)||sizes[Math.min(2,sizes.length-1)];let i=Math.max(0,sizes.indexOf(base)),d=0;if(ans.style==='clean')d--;if(ans.style==='extra')d++;if(ans.feel==='closer')d--;if(ans.feel==='loose')d++;i=Math.max(0,Math.min(sizes.length-1,i+Math.sign(d)));rec=sizes[i];document.getElementById('fitFinalSize').textContent=rec;document.getElementById('fitFinalText').textContent='Empfohlen für deinen gewünschten NOVAWEAR Fit.';render()}};window.fitApply=function(){try{sz=rec;if(typeof variants==='function')variants()}catch(e){}closeFitAdvisor();if(typeof toast==='function')toast('Größe '+rec+' übernommen ✓')};const oldOpen=window.openP;window.openP=function(id){oldOpen(id);setTimeout(addFit,30)};document.addEventListener('click',function(e){const card=e.target.closest('.card');if(card&&e.target.closest('button')===null){const btn=card.querySelector('.link');if(btn)btn.click()}},{passive:true});addFit()})();<\/script>`;html=html.replace('</head>',motionCSS+'</head>').replace('</body>',motionScript+'</body>');document.open();document.write(html);document.close()}).catch(()=>{location.replace('app.html')});</script></body></html>
