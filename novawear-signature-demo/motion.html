<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>NOVAWEAR® Motion Demo</title><style>html,body{margin:0;width:100%;height:100%;background:#050505;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="app.html"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{const d=f.contentDocument,w=f.contentWindow;const st=d.createElement('style');st.textContent=`@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(223,255,79,.35)}70%{box-shadow:0 0 0 12px rgba(223,255,79,0)}100%{box-shadow:0 0 0 0 rgba(223,255,79,0)}}@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1)}.reveal.in{opacity:1;transform:none}.heroimg img{transition:transform .75s cubic-bezier(.2,.8,.2,1),filter .5s}.heroimg:hover img{transform:scale(1.025)}.herocopy,.proofvis .gsm{animation:floatY 4.8s ease-in-out infinite}.card{transition:transform .28s ease,border-color .28s ease,box-shadow .28s ease}.card:hover{transform:translateY(-5px);border-color:#555;box-shadow:0 18px 45px #0008}.media img{transition:transform .45s cubic-bezier(.2,.8,.2,1)}.card:hover .media img{transform:scale(1.035)}.buy,.stickyatc button{transition:transform .18s ease,filter .18s ease}.buy:hover,.stickyatc button:hover{transform:translateY(-2px);filter:brightness(.94)}.fitLaunch{width:100%;margin-top:10px;padding:13px 14px;border:1px solid #dfff4f;background:linear-gradient(110deg,#171717,#222,#171717);background-size:200% 100%;color:#fff;font-size:10px;letter-spacing:.1em;font-weight:800;animation:shimmer 4s linear infinite}.fitLaunch i{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#dfff4f;color:#111;font-style:normal;margin-right:7px;animation:pulseRing 2s infinite}.fitModal{position:fixed;inset:0;z-index:120;display:none;align-items:flex-end;justify-content:center;padding:16px;background:rgba(0,0,0,.72);backdrop-filter:blur(10px)}.fitModal.open{display:flex;animation:fitFade .25s ease}@keyframes fitFade{from{opacity:0}to{opacity:1}}@keyframes fitUp{from{opacity:0;transform:translateY(40px) scale(.98)}to{opacity:1;transform:none}}.fitCard{width:min(560px,100%);background:#f4f3ee;color:#111;border-radius:20px 20px 8px 8px;overflow:hidden;animation:fitUp .38s cubic-bezier(.2,.8,.2,1);box-shadow:0 30px 90px #000c}.fitHead{padding:18px 18px 13px;border-bottom:1px solid #d8d7d0;display:flex;justify-content:space-between;gap:14px}.fitHead b{font-size:15px}.fitClose{border:0;background:none;font-size:22px}.fitProgress{height:4px;background:#ddd}.fitProgress i{display:block;height:100%;background:#111;transition:width .35s ease}.fitBody{padding:22px}.fitStep{display:none;animation:fadeUp .32s ease}.fitStep.on{display:block}.fitStep h3{font-size:28px;line-height:1;margin:0 0 8px;letter-spacing:-.04em}.fitStep p{color:#666;font-size:12px;line-height:1.5}.fitOptions{display:grid;gap:8px;margin-top:18px}.fitOption{border:1px solid #c7c6bf;background:#fff;padding:14px;text-align:left;border-radius:10px;transition:.18s}.fitOption:hover,.fitOption.sel{border-color:#111;background:#111;color:#fff;transform:translateY(-1px)}.fitFoot{padding:14px 18px;border-top:1px solid #d8d7d0;display:flex;justify-content:space-between;align-items:center}.fitNext{border:0;background:#111;color:#fff;padding:12px 16px;border-radius:8px;font-size:10px;letter-spacing:.08em}.fitNext:disabled{opacity:.35}.fitResultBox{border:1px solid #bbb;border-radius:12px;padding:16px;margin-top:14px;background:#fff}.fitResultSize{font-size:50px;font-weight:900;letter-spacing:-.07em}.fitApply{width:100%;border:0;background:#111;color:#fff;padding:14px;margin-top:12px;border-radius:8px;font-weight:800}@media(min-width:851px){.fitModal{align-items:center}.fitCard{border-radius:18px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.reveal{opacity:1;transform:none}}`;d.head.appendChild(st);const fb=d.querySelector('.fitbox');if(fb&&!fb.querySelector('.fitLaunch'))fb.insertAdjacentHTML('beforeend','<button class="fitLaunch" onclick="openFit()"><i>↗</i> ANIMIERTEN FITBERATER STARTEN</button>');d.body.insertAdjacentHTML('beforeend',`<div class="fitModal" id="fitModal" onclick="if(event.target===this)closeFit()"><div class="fitCard" role="dialog" aria-modal="true" aria-label="NOVAWEAR Fitberater"><div class="fitHead"><div><div class="eye" style="color:#666">NOVAWEAR® FIT SYSTEM</div><b>Finde deinen Fit in 3 Schritten</b></div><button class="fitClose" onclick="closeFit()">×</button></div><div class="fitProgress"><i id="fitProg" style="width:33%"></i></div><div class="fitBody"><div class="fitStep on" data-step="1"><h3>Wie trägst du Streetwear?</h3><p>Wähle die Silhouette, in der du dich am wohlsten fühlst.</p><div class="fitOptions"><button class="fitOption" onclick="fitPick('style','clean',this)"><b>Clean</b><br><small>Etwas kompakter, weniger Volumen.</small></button><button class="fitOption" onclick="fitPick('style','oversized',this)"><b>Oversized</b><br><small>Der vorgesehene NOVAWEAR Fit.</small></button><button class="fitOption" onclick="fitPick('style','extra',this)"><b>Extra Oversized</b><br><small>Maximales Volumen & Layering.</small></button></div></div><div class="fitStep" data-step="2"><h3>Wie groß bist du?</h3><p>Die Angabe dient in dieser Demo als zusätzlicher Fit-Hinweis.</p><div class="fitOptions"><button class="fitOption" onclick="fitPick('height','short',this)">Unter 170 cm</button><button class="fitOption" fitNextStep=function(){if(fitStep<3){fitStep++;renderFitStep()}else{fitStep=4;computeFit();renderFitStep()}};function renderFitStep(){d.querySelectorAll('.fitStep').forEach(x=>x.classList.toggle('on',Number(x.dataset.step)===fitStep));d.getElementById('fitProg').style.width=(fitStep===4?100:fitStep*33.33)+'%';d.getElementById('fitStepLabel').textContent=fitStep===4?'EMPFEHLUNG':'SCHRITT '+fitStep+' VON 3';const n=d.getElementById('fitNext');n.style.display=fitStep===4?'none':'block';n.disabled=fitStep<=3&&!fitAnswers[['style','height','feel'][fitStep-1]]}function computeFit(){let sizes=w.cur?.sizes||['XS','S','M','L','XL'];let current=w.sz||sizes[Math.min(2,sizes.length-1)];let idx=Math.max(0,sizes.indexOf(current)),delta=0;if(fitAnswers.style==='clean')delta--;if(fitAnswers.style==='extra')delta++;if(fitAnswers.feel==='closer')delta--;if(fitAnswers.feel==='loose')delta++;if(fitAnswers.height==='tall'&&fitAnswers.style!=='clean')delta++;if(fitAnswers.height==='short'&&fitAnswers.style==='clean')delta--;idx=Math.max(0,Math.min(sizes.length-1,idx+Math.sign(delta)));fitRecommended=sizes[idx];d.getElementById('fitFinalSize').textContent=fitRecommended;d.getElementById('fitFinalTitle').textContent=fitAnswers.style==='extra'?'Extra Oversized':'NOVAWEAR Oversized Fit';d.getElementById('fitFinalText').textContent='Empfohlen auf Basis deiner Auswahl und der aktuell gewählten Größe '+current+'.'}w.applyFit=function(){if(fitRecommended){w.sz=fitRecommended;if(typeof w.variants==='function')w.variants();const a=d.getElementById('fitanswer');if(a)a.textContent='Fitberater empfiehlt: '+fitRecommended}w.closeFit();if(typeof w.toast==='function')w.toast('Größe '+fitRecommended+' übernommen ✓')};const obs=new w.IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.08});d.querySelectorAll('.head,.card,.proof,.ugcitem,.socialStats,.reviewSummary,.reviewCard,.press>div').forEach((el,i)=>{el.classList.add('reveal');el.style.transitionDela
